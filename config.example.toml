[model]
base_url = "http://127.0.0.1:1234"
model = "qwen/qwen3.6-27b"
provider_profile = "lm_studio"
# Optional: name of an environment variable that contains the API key.
# api_key_env = "OPENAI_API_KEY"
connect_timeout_ms = 10000
request_timeout_ms = 3600000
max_retries = 2
context_window = 131072
supports_tools = true
supports_images = true
# context_window is used only for moyAI's local input accounting and compaction.
# Sampling, thinking, stop, output length, and provider-specific generation settings are configured on the host.

[permissions]
# default = ask for approval, auto_review = let the AI guardian decide,
# full_access = do not create permission prompts.
access_mode = "default"
# additional_read_roots and additional_write_roots, when set, must contain absolute paths.

[workspace]
# protected_paths, when set, must contain absolute paths.

[multi_agent]
enabled = true
mode = "explicit_request_only"
max_concurrent_agents = 4
max_concurrent_model_requests = 1

[docling]
enabled = false
base_url = "http://127.0.0.1:8123"
timeout_ms = 120000

[mcp]
enabled = false
